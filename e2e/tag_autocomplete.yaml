appId: com.feltech.feltlog
name: Tag autocomplete suggestions


# This flow verifies the tag autocomplete feature: typing a prefix in the tag
# input shows matching existing tags as suggestions, tapping a suggestion adds
# it as a chip and clears the input, a brand-new tag can still be added via
# the plus icon, and the autocomplete dropdown excludes tags already added to
# the current entry.
#
# Merged from:
#   - tag_autocomplete.yaml (autocomplete suggestions + plus icon)
#   - autocomplete_excludes_added.yaml (excludes already-added tags)
#
# Note: Because Feature 1 (default tags) auto-populates the second entry with
# tags from the most recent entry, the seeded tag "groceries" will already be
# present as a chip when the second entry opens. The autocomplete excludes
# already-added tags, so we must first remove the default "groceries" chip
# before typing "gro" to see it in the suggestions.
# Prerequisites: None - creates its own database and entries.
---
- runFlow: subflows/setup_database.yaml

# ===== CREATE FIRST ENTRY WITH TAG "groceries" (SEED THE TAG DB) =====

- evalScript: ${output.entry1Content = "Seed entry " + Date.now().toString()}
- evalScript: ${output.seedTag = "groceries"}

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: ${output.entry1Content}

- assertVisible: 'Tags'
# Blur the content field so the soft keyboard is dismissed and the tag input is
# reachable, then scroll it into view.
- runFlow: subflows/blur_editor_input.yaml
- scrollUntilVisible:
    element:
      id: 'tag-input'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'tag-input'
- inputText: ${output.seedTag}
- pressKey: Enter
- waitForAnimationToEnd

- assertVisible: ${output.seedTag}

# Save and return. Blur the focused input first so the system BACK event
# reaches the navigator instead of being consumed by the IME.
- runFlow: subflows/blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'

# Dismiss the LogBox banner if present (it can overlap the FAB).
- runFlow: subflows/dismiss_logbox_banner.yaml

# ===== CREATE SECOND ENTRY AND TEST AUTOCOMPLETE =====

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

# Feature 1: "groceries" is auto-populated as a default tag. Remove it first
# so that typing "gro" will show it in the autocomplete suggestions (the
# autocomplete excludes already-added tags).
- extendedWaitUntil:
    visible: ${output.seedTag}
    timeout: 5000

- assertVisible: ${output.seedTag}

- takeScreenshot: second-entry-default-groceries

# Wait for the default-tag async population to settle before interacting with
# the chip's Close button. Without this, the close-button tap can complete
# before the chip is fully mounted and the tag is not actually removed.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.seedTag}
    timeout: 2000

# Remove the default "groceries" chip so we can test autocomplete showing it
- tapOn:
    text: 'Close'
    rightOf:
      text: ${output.seedTag}
- waitForAnimationToEnd

- assertNotVisible: ${output.seedTag}

# Type a prefix that matches the seeded tag
- tapOn:
    id: 'tag-input'
- inputText: 'gro'

# Dismiss the keyboard so the autocomplete dropdown below the tag input is
# visible and can be asserted/tapped.
- runFlow: subflows/blur_editor_input.yaml

# Wait for the autocomplete dropdown to appear
- extendedWaitUntil:
    visible:
      id: 'tag-suggestions'
    timeout: 5000

- takeScreenshot: autocomplete-dropdown-visible

# Verify the suggestions dropdown is visible and contains "groceries"
- assertVisible:
    id: 'tag-suggestions'
- assertVisible:
    id: 'tag-suggestion-groceries'

# Tap the "groceries" suggestion
- tapOn:
    id: 'tag-suggestion-groceries'
- waitForAnimationToEnd

- takeScreenshot: after-tapping-suggestion

# Verify "groceries" is added as a chip
- assertVisible: ${output.seedTag}

# Verify the suggestions dropdown is dismissed after selecting
- assertNotVisible:
    id: 'tag-suggestions'

# ===== ADD A BRAND-NEW TAG VIA THE PLUS ICON =====

- evalScript: ${output.newTag = "shopping"}
- tapOn:
    id: 'tag-input'
- inputText: ${output.newTag}

# The soft keyboard may cover the add-tag-icon after typing. Scroll it into
# view before tapping.
- scrollUntilVisible:
    element:
      id: 'add-tag-icon'
    direction: DOWN
    timeout: 5000

# Tap the plus icon to add the new tag
- tapOn:
    id: 'add-tag-icon'
- waitForAnimationToEnd

- takeScreenshot: after-adding-new-tag-via-plus

# Verify "shopping" is added as a chip
- assertVisible: ${output.newTag}

# Verify both tags are present
- assertVisible: ${output.seedTag}
- assertVisible: ${output.newTag}

# Save and return. Blur the focused input first so the system BACK event
# reaches the navigator instead of being consumed by the IME.
- runFlow: subflows/blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'

# ===== TEST AUTOCOMPLETE EXCLUDES ALREADY-ADDED TAGS =====
# Create a second seed entry with tag "exercise", then create another entry,
# add "exercise" to it via the plus icon, and verify typing "ex" does NOT show
# the autocomplete dropdown (because "exercise" is already added to this entry).

# Dismiss the LogBox banner if present (it can overlap the FAB).
- runFlow: subflows/dismiss_logbox_banner.yaml

# Create a seed entry with tag "exercise" (seeds the tag DB).
- evalScript: ${output.excludeSeedContent = "Seed entry for exclusion " + Date.now().toString()}
- evalScript: ${output.excludeTag = "exercise"}

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: ${output.excludeSeedContent}

- assertVisible: 'Tags'
# Blur the content field so the soft keyboard is dismissed and the tag input is
# reachable, then scroll it into view.
- runFlow: subflows/blur_editor_input.yaml
- scrollUntilVisible:
    element:
      id: 'tag-input'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'tag-input'
- inputText: ${output.excludeTag}
- pressKey: Enter
- waitForAnimationToEnd

- assertVisible: ${output.excludeTag}

# Save and return. Blur the focused input first so the system BACK event
# reaches the navigator instead of being consumed by the IME.
- runFlow: subflows/blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'

# Dismiss the LogBox banner if present (it can overlap the FAB).
- runFlow: subflows/dismiss_logbox_banner.yaml

# Create another entry and add "exercise" to it via the plus icon.
- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

# Add "exercise" to this entry via the plus icon. The soft keyboard may cover
# the add-tag-icon after typing; scroll it into view before tapping.
- tapOn:
    id: 'tag-input'
- inputText: ${output.excludeTag}
- scrollUntilVisible:
    element:
      id: 'add-tag-icon'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'add-tag-icon'
- waitForAnimationToEnd

# Verify "exercise" is now a chip on this entry
- assertVisible: ${output.excludeTag}

# Now type a prefix that would match "exercise"
- tapOn:
    id: 'tag-input'
- inputText: 'ex'

- takeScreenshot: autocomplete-after-adding-exercise

# Give the dropdown a moment to potentially appear, then verify it does NOT.
# Since "exercise" is the only matching tag and it's already added, the
# suggestions dropdown should not be visible.
- extendedWaitUntil:
    visible:
      id: 'tag-suggestions'
    timeout: 1500
    optional: true

- assertNotVisible:
    id: 'tag-suggestions'

# Verify the suggestion for "exercise" is not present
- assertNotVisible:
    id: 'tag-suggestion-exercise'

- takeScreenshot: autocomplete-excludes-added-tag

# Save and return. Blur the focused input first so the system BACK event
# reaches the navigator instead of being consumed by the IME.
- runFlow: subflows/blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'
