# Subflow to create a journal entry
appId: com.feltech.feltlog
---
# Default location
- setLocation:
    latitude: 53.787977855061214
    longitude: -2.244492876694697

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'
- tapOn:
    id: 'entry-content-input'
- inputText: ${content || "Default entry content"}
# Dismiss keyboard / blur input before system back to prevent IME from
# consuming the BACK event on real devices.
- tapOn:
    id: 'appbar-header'
# System back button saves and closes
- pressKey: BACK
- waitForAnimationToEnd
- assertVisible:
    id: 'create-entry-fab'
