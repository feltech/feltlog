# Subflow to create a journal entry
appId: com.feltech.feltlog
---
# Default location
- setLocation:
    latitude: 53.787977855061214
    longitude: -2.244492876694697

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'
- tapOn:
    id: 'entry-content-input'
- inputText: ${content || "Default entry content"}
# Blur the focused input before system back so the IME does not consume the
# BACK event. The editor's beforeRemove interceptor flushes the new entry.
- runFlow: blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'
