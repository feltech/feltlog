appId: com.feltech.feltlog
name: Autosave and undo/redo features


# This flow tests the undo/redo features in the journal entry editor and
# verifies that pending edits are persisted via the back-navigation flush.
#
# Save model (current behaviour):
#   - There is NO in-session debounced autosave. Pending edits are persisted
#     only when the user leaves the editor via back navigation (beforeRemove
#     flush) or when the app moves to background/inactive (AppState listener).
#   - The autoSaving/lastSaved/saved indicators only appear during those
#     explicit flush moments, not while the user is typing. We therefore do
#     NOT assert on a saved-indicator appearing mid-edit.
#
# Prerequisites: App already set up with a test database.
---
- runFlow:
    file: subflows/setup_database.yaml
    env:
      dbName: 'db_autosave.db'
      dbKey: 'key_autosave'

# Use existing entry or create new one for editing
- evalScript: ${output.testEntry = "Test edit " + Date.now().toString()}

# Create a test entry that we'll edit
- runFlow:
    file: subflows/create_entry.yaml
    env:
      content: ${output.testEntry}

# ===== TEST EDIT MODE - BACK FLUSH PERSISTS EDIT =====

# Edit the entry we just created
- tapOn: 'Journal entry card'
- assertVisible:
    id: 'entry-content-input'

# Type some additional content. Under the new save model this does NOT
# trigger a mid-session autosave; the edit is only persisted on back
# navigation. We verify persistence by re-opening the entry after the
# back flush below.
- tapOn:
    id: 'entry-content-input'
- inputText: ' additional text'
- waitForAnimationToEnd
- takeScreenshot: edit-mode-after-typing

# ===== TEST UNDO/REDO WITH KEYSTROKE COALESCING =====

# --- Part A: Undo proof (separate bursts) ---
# Blur the focused input before system back so the IME does not consume the
# BACK event. The editor's beforeRemove interceptor flushes the edit.
- runFlow: subflows/blur_and_back.yaml
- assertVisible: 'Create entry'

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: 'Hello'

# Wait 500ms for the coalescing timer to expire
- extendedWaitUntil:
    visible:
      id: 'non-existent-element-for-delay'
    timeout: 500
    optional: true

- inputText: ' World'

# Undo reverts the ' World' burst, leaving 'Hello'
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd

# Type ' again' — if undo worked, content becomes 'Hello again'.
# If undo failed, content would be 'Hello World again', which does NOT
# contain 'Hello again' as a contiguous substring.
- inputText: ' again'
# Wait so this typing gets its own undo entry
- extendedWaitUntil:
    visible:
      id: 'non-existent-element-for-delay'
    timeout: 500
    optional: true

# PROOF: only matches if undo removed ' World'
- assertVisible: 'Hello again'

# Clean up: undo back to empty then close
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd

# --- Part B: Redo proof ---
# Blur the focused input before system back so the IME does not consume the
# BACK event.
- runFlow: subflows/blur_and_back.yaml
- assertVisible: 'Create entry'

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: 'Foo'
- extendedWaitUntil:
    visible:
      id: 'non-existent-element-for-delay'
    timeout: 500
    optional: true

- inputText: 'Bar'

# Undo 'Bar' → 'Foo'
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd

# Redo → 'FooBar'
- tapOn:
    id: 'redo-button'
- waitForAnimationToEnd

# Type 'Baz' → 'FooBarBaz' (if redo worked) or 'FooBaz' (if redo failed)
- inputText: 'Baz'

# PROOF: if redo worked, content is 'FooBarBaz' and 'FooBaz' does NOT
# appear contiguously. If redo failed, content is 'FooBaz' and 'FooBaz'
# IS visible.
- assertNotVisible: 'FooBaz'
- assertVisible: 'FooBarBaz'

# --- Part C: Redo stack cleared by new typing ---
# After undo, typing new content must clear the redo stack so redo is
# impossible. Tapping redo should be a no-op. Undo for the new typing
# must still work.

# Blur the focused input before system back so the IME does not consume the
# BACK event.
- runFlow: subflows/blur_and_back.yaml
- assertVisible: 'Create entry'

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: 'X'
- extendedWaitUntil:
    visible:
      id: 'non-existent-element-for-delay'
    timeout: 500
    optional: true

- inputText: 'Y'

# Undo 'Y' → 'X' (redo stack now has 'XY')
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd

# Type 'Z' — this clears the redo stack
- inputText: 'Z'
- extendedWaitUntil:
    visible:
      id: 'non-existent-element-for-delay'
    timeout: 500
    optional: true

# Tap redo — must be a no-op because the redo stack was cleared
- tapOn:
    id: 'redo-button'
- waitForAnimationToEnd

# PROOF: content is unchanged ('XZ'), old state 'XY' is gone
- assertVisible: 'XZ'
- assertNotVisible: 'XY'

# Undo must still work for the new typing ('Z')
- tapOn:
    id: 'undo-button'
- waitForAnimationToEnd
- assertVisible: 'X'

# Save and close. Blur the focused input first so the system BACK event
# reaches the navigator instead of being consumed by the IME.
- runFlow: subflows/blur_and_back.yaml
- assertVisible:
    id: 'create-entry-fab'
