appId: com.feltech.feltlog
name: Location no-permission state


# This flow tests the "no location" state for entries created without location
# permission, and the re-center button's ability to add a location to a
# no-location entry.
#
# TEST 1: Entry with no saved location shows text, no spinner, and the
#         re-center button is present.
# TEST 2: Re-center button can add a location to a no-location entry.
#
# The re-center-on-existing-entry and double-tap-safety scenarios are covered
# by location_features.yaml (Tests 7 and 7b), so they are not duplicated here.
#
# By using a fresh database with one entry at a time, this test avoids
# the multi-card matching problem on the journal list.
#
# Merged/stripped from:
#   - location_recenter.yaml (Tests 1 and 4 removed as redundant)
#
# Prerequisites: None - this test is independent and creates its own entries.
---
- runFlow: subflows/setup_database.yaml

# ===== SET PERMISSIONS AND MOCK LOCATION =====
- setPermissions:
    permissions:
      all: allow

# ===== TEST 1: Entry with no saved location — no spinner, text visible, re-center present =====
# Deny location permission, create an entry, save it, reopen it.
# Verify:
# - "No location was recorded for this entry" is visible
# - No loading spinner / map is shown
# - The re-center button is present
#
# TODO(workaround): work around an upstream React Native Scheduler
# use-after-free that crashes the new process with a SEGV_ACCERR in
# MountingCoordinator::pullTransaction when the app is killed
# mid-mount-transaction. Triggered here by setPermissions killing the
# active app process while a Fabric mount transaction is in flight.
#
# Fixed in RN 0.86.0 via
# https://github.com/facebook/react-native/pull/56680
# (commit aadbe96579, "Guard Scheduler deferred lambdas against
# delegate teardown"). The fix is gated behind the
# enableSchedulerDelegateInvalidation feature flag — verify the flag
# is enabled in the upgraded version before removing this block.
#
# When bumping RN past 0.85.3, re-test Tests 1 and 2 and consider
# removing the stopApp + clearState + stabilization + retry block
# below.
- stopApp
- clearState

- setPermissions:
    permissions:
      location: deny

# Stabilization window: let Android release the old process before
# cold-starting.
- extendedWaitUntil:
    visible:
      id: 'non-existent-stabilization-wait'
    timeout: 10000
    optional: true

# Set up a fresh database with location denied.
- launchApp:
    permissions:
      location: deny
- waitForAnimationToEnd

# Wait for the setup screen to be ready.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 15000
    optional: true

# If the setup screen never appeared, the app likely crashed during
# launch after the permission toggle. Retry the launch once.
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      - stopApp
      - launchApp:
          permissions:
            location: deny
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 15000

# Final guard: the setup screen must be visible before entering credentials.
- assertVisible:
    id: 'db-name-input'

# Set up a fresh database
- evalScript: ${output.dbName2 = "noloc_" + Date.now().toString() + ".db"}
- evalScript: ${output.dbKey2 = "key_" + Date.now().toString()}
- tapOn:
    id: 'db-name-input'
    point: '95%,50%'
- eraseText
- inputText: ${output.dbName2}
- tapOn:
    id: 'db-key-input'
- inputText: ${output.dbKey2}
- tapOn:
    id: 'db-open-btn'
- assertVisible: 'Create entry'

- evalScript: ${output.noLocationEntryText = "No location " + Date.now().toString()}

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

- tapOn:
    id: 'create-entry-fab'

# With location: deny, the app may still show the Android system
# permission prompt (canAskAgain is true). Dismiss it by denying.
# Handle both deny button variants: first-denial shows
# "permission_deny_button", subsequent denials show
# "permission_deny_and_dont_ask_again_button".
- runFlow:
    when:
      visible:
        id: 'com.android.permissioncontroller:id/permission_deny_button'
    commands:
      - tapOn:
          id: 'com.android.permissioncontroller:id/permission_deny_button'
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'com.android.permissioncontroller:id/permission_deny_and_dont_ask_again_button'
    commands:
      - tapOn:
          id: 'com.android.permissioncontroller:id/permission_deny_and_dont_ask_again_button'
      - waitForAnimationToEnd

- assertVisible:
    id: 'entry-content-input'

# Wait for the location fetch attempt to complete
- waitForAnimationToEnd

# Verify the permission-denial hint is shown for new entries
- assertVisible:
    'Location permission not granted. You can still save the entry without a location.'

# Type content
- tapOn:
    id: 'entry-content-input'
- inputText: ${output.noLocationEntryText}

# Save entry (system back saves)
- tapOn:
    id: 'appbar-header'
- pressKey: Back
- waitForAnimationToEnd
- assertVisible: 'Create entry'

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Re-open the entry we just saved (it has no location).
# With a fresh database there's only 1 entry on the list.
# Wait for the card to appear on the list before tapping.
- extendedWaitUntil:
    visible: 'Journal entry card'
    timeout: 5000

- tapOn:
    id: 'journal-entry-card-container'
- waitForAnimationToEnd

# Wait for the ViewModel entries to load and the editor to settle into
# edit mode. The entry-content-input should become visible once the
# editor is ready.
- extendedWaitUntil:
    visible:
      id: 'entry-content-input'
    timeout: 5000

# Verify the entry content matches
- assertVisible: ${output.noLocationEntryText}

# Wait for any transient location logic to settle
- waitForAnimationToEnd

# Verify "No location was recorded for this entry" text is visible
- assertVisible: 'No location was recorded for this entry.'

# Verify the re-center button is present even when entry has no location
- assertVisible:
    id: 'recenter-button'

# Verify NO map is shown (no location to centre on)
- assertNotVisible:
    id: 'entry-location-map'

# Verify NO map container (no map rendered for an entry without location)
- assertNotVisible:
    id: 'map-container'

- takeScreenshot: screenshot-no-location-entry

# Go back to list
- tapOn:
    id: 'appbar-header'
- pressKey: Back
- waitForAnimationToEnd
- assertVisible: 'Create entry'

# ===== TEST 2: Re-center button adds location to a no-location entry =====
# Re-open the no-location entry, grant location permission, tap re-center,
# and verify the map and address appear.
#
# TODO(workaround): work around an upstream React Native Scheduler
# use-after-free that crashes the new process with a SEGV_ACCERR in
# MountingCoordinator::pullTransaction when the app is killed
# mid-mount-transaction. Triggered here by setPermissions killing the
# active app process while a Fabric mount transaction is in flight.
#
# Fixed in RN 0.86.0 via
# https://github.com/facebook/react-native/pull/56680
# (commit aadbe96579, "Guard Scheduler deferred lambdas against
# delegate teardown"). The fix is gated behind the
# enableSchedulerDelegateInvalidation feature flag — verify the flag
# is enabled in the upgraded version before removing this block.
#
# When bumping RN past 0.85.3, re-test Tests 1 and 2 and consider
# removing the stopApp + clearState + stabilization + retry block
# below.
- stopApp

- setPermissions:
    permissions:
      location: allow

# Stabilization window: give Android time to tear down the process and
# drain any pending Fabric work before relaunching.
- extendedWaitUntil:
    visible:
      id: 'non-existent-stabilization-wait'
    timeout: 10000
    optional: true

- setLocation:
    latitude: 35.6762
    longitude: 139.6503

- launchApp:
    permissions:
      location: allow
- waitForAnimationToEnd

# Give the app time to reach either the setup screen or the journal
# list. The optional timeout is silently ignored if the element is not
# found, which lets us detect a crash and retry below.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 15000
    optional: true

# If the app restarted at the setup screen, re-enter credentials.
- runFlow:
    when:
      visible:
        id: 'db-name-input'
    commands:
      - tapOn:
          id: 'db-name-input'
          point: '95%,50%'
      - eraseText
      - inputText: ${output.dbName2}
      - tapOn:
          id: 'db-key-input'
      - inputText: ${output.dbKey2}
      - tapOn:
          id: 'db-open-btn'
      - assertVisible: 'Create entry'

# Wait for the journal list to be ready.
- extendedWaitUntil:
    visible: 'Create entry'
    timeout: 15000
    optional: true

# If the journal list never appeared, the app likely crashed during
# launch after the permission toggle. Retry the launch once.
- runFlow:
    when:
      notVisible: 'Create entry'
    commands:
      - stopApp
      - launchApp:
          permissions:
            location: allow
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'db-name-input'
          commands:
            - tapOn:
                id: 'db-name-input'
                point: '95%,50%'
            - eraseText
            - inputText: ${output.dbName2}
            - tapOn:
                id: 'db-key-input'
            - inputText: ${output.dbKey2}
            - tapOn:
                id: 'db-open-btn'
            - assertVisible: 'Create entry'
      - extendedWaitUntil:
          visible: 'Create entry'
          timeout: 15000

# Final guard: the journal list must be visible before we interact
# with any entry card.
- assertVisible: 'Create entry'

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# With only 1 entry on the list, just tap the card directly.
- tapOn: 'Journal entry card'
- waitForAnimationToEnd

- assertVisible:
    id: 'entry-content-input'

# Verify the entry content matches
- assertVisible: ${output.noLocationEntryText}

# Wait for any transient state to settle
- waitForAnimationToEnd

# The entry still has no saved location, so the "no location" text should
# still be visible before we tap re-center.
- assertVisible: 'No location was recorded for this entry.'

# Tap the re-center button to fetch the current (Tokyo) location
- tapOn:
    id: 'recenter-button'

# Wait for the position fetch + reverse geocode to complete.
# The map should appear after the location is fetched.
- extendedWaitUntil:
    visible:
      id: 'entry-location-map'
    timeout: 15000

# Verify the map container is now visible
- assertVisible:
    id: 'map-container'

# Verify geocoded address text is displayed (Tokyo)
- extendedWaitUntil:
    visible:
      id: 'location-address-text'
    timeout: 8000

- takeScreenshot: screenshot-no-location-after-recenter

# Save the entry with the new location
- tapOn:
    id: 'appbar-header'
- pressKey: Back
- waitForAnimationToEnd
- assertVisible: 'Create entry'
