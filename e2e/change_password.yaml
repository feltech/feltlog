      - waitForAnimationToEnd

# Verify backup location is configured and encryption is disabled
- assertVisible: 'Location: (Pictures|Documents)'
- assertVisible: 'Encryption: Disabled'

# ===== OPEN CHANGE PASSWORD DIALOG =====
- tapOn:
    id: 'change-password-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-c-dialog-open

# Verify dialog shows unencrypted helper text
- assertVisible:
    id: 'change-password-dialog'
- assertVisible: 'Database is unencrypted.*'

# Fill in the form: current key left empty (default), new key provided
- tapOn:
    id: 'change-password-new-key'
- inputText: 'newencryptionkey'
- tapOn:
    id: 'change-password-confirm-key'
- inputText: 'newencryptionkey'
- takeScreenshot: change-pwd-c-form-filled

# Dismiss the soft keyboard so dialog buttons become visible
- hideKeyboard
- waitForAnimationToEnd

# Submit the form
- tapOn:
    id: 'change-password-submit'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-c-confirm-dialog

# Safety backup confirm dialog should appear
- assertVisible:
    id: 'change-password-confirm-dialog'

# Proceed with the safety backup
- tapOn:
    id: 'change-password-confirm-proceed'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-after-proceed

# After a successful rekey, the app resets to the setup screen (no success
# snackbar is shown — the component tree unmounts as the setup screen replaces
# it). Wait for the setup screen to appear, proving the reset happened.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 120000
- takeScreenshot: change-pwd-c-reset-to-setup
