appId: com.feltech.feltlog
name: Change password


# E2E test for the Change Password feature.
# Verifies changing encryption password, removing encryption, and adding encryption
# to an unencrypted database, all with safety backups.
#
# Flow A: Change password on encrypted DB (happy path).
#   Sets up encrypted DB, configures backup location, changes password.
#
# Flow B: Remove encryption (empty new key on encrypted DB).
#   Sets up encrypted DB, configures backup location, removes encryption.
#
# Flow C: Add encryption to unencrypted DB.
#   Creates unencrypted DB, configures backup location, adds encryption.
---
# Flow A: Change password with backup (happy path)
# Dismiss any foreground SAF file picker left over from a previous (interrupted)
# flow. clearState only clears the app's process state; it does NOT close a
# system picker activity foregrounded on top of the app. An unconditional BACK
# press here is safe in all states (picker open, app foreground, or launcher).
- pressKey: BACK
# Collapse clearState + launchApp into a single launchApp: clearState: true
# call. This reduces the number of ADB process-kill boundaries (each kill can
# race with an in-flight Fabric mount transaction and trigger the upstream
# React Native Scheduler use-after-free, SIGSEGV in mqt_v_js). launchApp
# applies the clearState atomically as part of the launch, so the separate
# clearState kill is no longer needed. See location_no_permission.yaml for
# the same pattern.
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Wait for the app to fully load after clearState kills the process
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      # clearState can foreground a SAF picker that ActivityManager had
      # backgrounded during a previous flow. Dismiss it before re-launching,
      # otherwise the picker covers the setup screen.
      - pressKey: BACK
      - launchApp
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 30000

# ===== SETUP: Create encrypted database =====
- evalScript: ${output.dbName = "change_pwd_" + Date.now() + ".db"}
- evalScript: ${output.dbKey = "change_pwd_key"}

- assertVisible:
    id: 'db-name-input'
- tapOn:
    id: 'db-name-input'
    point: '95%,50%'
- eraseText
- inputText: ${output.dbName}
- tapOn:
    id: 'db-key-input'
- inputText: ${output.dbKey}
- tapOn:
    id: 'db-open-btn'

- assertVisible: 'Create entry'
- takeScreenshot: change-pwd-a-journal-ready

# ===== NAVIGATE TO SETTINGS AND CONFIGURE BACKUP LOCATION =====
- waitForAnimationToEnd
- tapOn:
    point: '50%,96%'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-a-settings

# Configure backup location via SAF picker
- tapOn:
    id: 'choose-backup-location-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-a-saf-picker

- runFlow:
    when:
      visible: 'sdk_gphone64_x86_64'
    commands:
      - tapOn: 'sdk_gphone64_x86_64'
      - waitForAnimationToEnd

- scrollUntilVisible:
    element: 'Pictures'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: 'Pictures'
    commands:
      - tapOn: 'Pictures'
      - waitForAnimationToEnd

- tapOn: 'USE THIS FOLDER'
- waitForAnimationToEnd
- tapOn: 'ALLOW'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-a-location-set

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Verify backup location is configured
- assertVisible: 'Location: (Pictures|Documents)'

# ===== OPEN CHANGE PASSWORD DIALOG =====
- tapOn:
    id: 'change-password-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-a-dialog-open

# Verify dialog elements
- assertVisible:
    id: 'change-password-dialog'
- assertVisible:
    id: 'change-password-current-key'
- assertVisible:
    id: 'change-password-new-key'
- assertVisible:
    id: 'change-password-confirm-key'
- assertVisible:
    id: 'change-password-cancel'
- assertVisible:
    id: 'change-password-submit'

# Fill in the form
- tapOn:
    id: 'change-password-current-key'
- inputText: ${output.dbKey}
- tapOn:
    id: 'change-password-new-key'
- inputText: 'new_${output.dbKey}'
- tapOn:
    id: 'change-password-confirm-key'
- inputText: 'new_${output.dbKey}'
- takeScreenshot: change-pwd-a-form-filled

# Dismiss the soft keyboard so dialog buttons become visible
- hideKeyboard
- waitForAnimationToEnd

# Submit the form
- tapOn:
    id: 'change-password-submit'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-a-confirm-dialog

# Safety backup confirm dialog should appear
- assertVisible:
    id: 'change-password-confirm-dialog'
- assertVisible:
    id: 'change-password-confirm-cancel'
- assertVisible:
    id: 'change-password-confirm-proceed'

# Proceed with the safety backup
- tapOn:
    id: 'change-password-confirm-proceed'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-after-proceed

# After a successful rekey, the app resets to the setup screen (no success
# snackbar is shown — the component tree unmounts as the setup screen replaces
# it). Wait for the setup screen to appear, proving the reset happened, then
# prove the change-password dialog is gone. SAF backup + rekey can take
# 30-90s on emulator.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 120000
- takeScreenshot: change-pwd-a-reset-to-setup

# Verify the change-password dialog is no longer present (it unmounted with
# the settings screen during the reset).
- assertNotVisible:
    id: 'change-password-dialog'

# Flow B: Remove encryption (empty new key on encrypted DB)
# Dismiss any foreground SAF picker left over from the previous flow (see
# Flow A for rationale).
- pressKey: BACK
# Collapse clearState + launchApp into a single launchApp: clearState: true
# call (see Flow A for rationale).
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Wait for the app to fully load after clearState kills the process
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      # clearState can foreground a backgrounded SAF picker; dismiss it
      # before re-launching.
      - pressKey: BACK
      - launchApp
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 30000

# ===== SETUP: Create encrypted database =====
- evalScript: ${output.dbName = "remove_enc_" + Date.now() + ".db"}
- evalScript: ${output.dbKey = "remove_enc_key"}

- assertVisible:
    id: 'db-name-input'
- tapOn:
    id: 'db-name-input'
    point: '95%,50%'
- eraseText
- inputText: ${output.dbName}
- tapOn:
    id: 'db-key-input'
- inputText: ${output.dbKey}
- tapOn:
    id: 'db-open-btn'

- assertVisible: 'Create entry'
- takeScreenshot: change-pwd-b-journal-ready

# ===== NAVIGATE TO SETTINGS AND CONFIGURE BACKUP LOCATION =====
- waitForAnimationToEnd
- tapOn:
    point: '50%,96%'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-b-settings

# Configure backup location via SAF picker
- tapOn:
    id: 'choose-backup-location-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-b-saf-picker

- runFlow:
    when:
      visible: 'sdk_gphone64_x86_64'
    commands:
      - tapOn: 'sdk_gphone64_x86_64'
      - waitForAnimationToEnd

- scrollUntilVisible:
    element: 'Pictures'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: 'Pictures'
    commands:
      - tapOn: 'Pictures'
      - waitForAnimationToEnd

- tapOn: 'USE THIS FOLDER'
- waitForAnimationToEnd
- tapOn: 'ALLOW'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-b-location-set

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Verify backup location is configured
- assertVisible: 'Location: (Pictures|Documents)'

# ===== OPEN CHANGE PASSWORD DIALOG =====
- tapOn:
    id: 'change-password-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-b-dialog-open

# Verify dialog elements
- assertVisible:
    id: 'change-password-dialog'
- assertVisible:
    id: 'change-password-current-key'
- assertVisible:
    id: 'change-password-new-key'
- assertVisible:
    id: 'change-password-confirm-key'

# Fill in the form: current key provided, new key left empty (default)
- tapOn:
    id: 'change-password-current-key'
- inputText: ${output.dbKey}
- takeScreenshot: change-pwd-b-form-filled

# Dismiss the soft keyboard so dialog buttons become visible
- hideKeyboard
- waitForAnimationToEnd

# Submit the form
- tapOn:
    id: 'change-password-submit'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-b-confirm-dialog

# Safety backup confirm dialog should appear
- assertVisible:
    id: 'change-password-confirm-dialog'

# Proceed with the safety backup
- tapOn:
    id: 'change-password-confirm-proceed'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-after-proceed

# After a successful rekey, the app resets to the setup screen (no success
# snackbar is shown — the component tree unmounts as the setup screen replaces
# it). Wait for the setup screen to appear, proving the reset happened.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 120000
- takeScreenshot: change-pwd-b-reset-to-setup

# Flow C: Add encryption to unencrypted DB
# Dismiss any foreground SAF picker left over from the previous flow (see
# Flow A for rationale).
- pressKey: BACK
# Collapse clearState + launchApp into a single launchApp: clearState: true
# call (see Flow A for rationale).
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Wait for the app to fully load after clearState kills the process
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      # clearState can foreground a backgrounded SAF picker; dismiss it
      # before re-launching.
      - pressKey: BACK
      - launchApp
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 30000

# ===== SETUP: Create unencrypted database =====
- evalScript: ${output.dbName = "add_enc_" + Date.now() + ".db"}

- assertVisible:
    id: 'db-name-input'
- tapOn:
    id: 'db-name-input'
    point: '95%,50%'
- eraseText
- inputText: ${output.dbName}
# Leave key field empty for unencrypted DB
- tapOn:
    id: 'db-open-btn'

- assertVisible: 'Create entry'
- takeScreenshot: change-pwd-c-journal-ready

# ===== NAVIGATE TO SETTINGS AND CONFIGURE BACKUP LOCATION =====
- waitForAnimationToEnd
- tapOn:
    point: '50%,96%'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-c-settings

# Configure backup location via SAF picker
- tapOn:
    id: 'choose-backup-location-btn'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-c-saf-picker

- runFlow:
    when:
      visible: 'sdk_gphone64_x86_64'
    commands:
      - tapOn: 'sdk_gphone64_x86_64'
      - waitForAnimationToEnd

- scrollUntilVisible:
    element: 'Pictures'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: 'Pictures'
    commands:
      - tapOn: 'Pictures'
      - waitForAnimationToEnd

- tapOn: 'USE THIS FOLDER'
- waitForAnimationToEnd
- tapOn: 'ALLOW'
- waitForAnimationToEnd
- takeScreenshot: change-pwd-c-location-set

# Dismiss LogBox warning banner if present
