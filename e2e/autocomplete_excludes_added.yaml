appId: com.feltech.feltlog
name: Autocomplete excludes already-added tags


# This flow verifies that the autocomplete dropdown does not suggest tags that
# have already been added to the current entry.
# Prerequisites: None - creates its own database and entries.
---
- runFlow: subflows/setup_database.yaml

# ===== CREATE FIRST ENTRY WITH TAG "exercise" (SEED THE TAG DB) =====

- evalScript: ${output.entry1Content = "Seed entry for exclusion " + Date.now().toString()}
- evalScript: ${output.seedTag = "exercise"}

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: ${output.entry1Content}

- assertVisible: 'Tags'
- tapOn:
    id: 'tag-input'
- inputText: ${output.seedTag}
- pressKey: Enter
- waitForAnimationToEnd

- assertVisible: ${output.seedTag}

- tapOn:
    id: 'appbar-header'
- pressKey: BACK
- waitForAnimationToEnd
- assertVisible:
    id: 'create-entry-fab'

# Dismiss the LogBox banner if present (it can overlap the FAB).
- runFlow: subflows/dismiss_logbox_banner.yaml

# ===== CREATE SECOND ENTRY, ADD "exercise", THEN VERIFY IT'S EXCLUDED =====

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

# Add "exercise" to this entry via the plus icon
- tapOn:
    id: 'tag-input'
- inputText: ${output.seedTag}
- tapOn:
    id: 'add-tag-icon'
- waitForAnimationToEnd

# Verify "exercise" is now a chip on this entry
- assertVisible: ${output.seedTag}

# Now type a prefix that would match "exercise"
- tapOn:
    id: 'tag-input'
- inputText: 'ex'

- takeScreenshot: autocomplete-after-adding-exercise

# Give the dropdown a moment to potentially appear, then verify it does NOT.
# Since "exercise" is the only matching tag and it's already added, the
# suggestions dropdown should not be visible.
- extendedWaitUntil:
    visible:
      id: 'tag-suggestions'
    timeout: 1500
    optional: true

- assertNotVisible:
    id: 'tag-suggestions'

# Verify the suggestion for "exercise" is not present
- assertNotVisible:
    id: 'tag-suggestion-exercise'

- takeScreenshot: autocomplete-excludes-added-tag

# Save and return
- tapOn:
    id: 'appbar-header'
- pressKey: BACK
- waitForAnimationToEnd
- assertVisible:
    id: 'create-entry-fab'
