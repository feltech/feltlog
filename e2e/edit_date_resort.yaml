appId: com.feltech.feltlog
name: Edit date re-sort


# Editing an entry's date to a past date causes it to display the new date in the
# journal list and re-sort below entries with newer dates.
---
- runFlow: subflows/setup_database.yaml

# ===== CREATE ENTRY A =====

- evalScript: ${output.entryA = 'Entry A ' + Date.now()}
- runFlow:
    file: subflows/create_entry.yaml
    env:
      content: ${output.entryA}

# ===== CREATE ENTRY B =====

- evalScript: ${output.entryB = 'Entry B ' + Date.now()}
- runFlow:
    file: subflows/create_entry.yaml
    env:
      content: ${output.entryB}

# Dismiss the LogBox warning banner if present — it can cover cards and FABs.
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# ===== VERIFY STARTING ORDER: B ABOVE A =====

# B was created after A, so it sorts to the top of the datetime-DESC list.
- assertVisible: ${output.entryB}
- takeScreenshot: starting-order-b-above-a

# ===== EDIT ENTRY B'S DATE =====

# Open the top entry (entry B) for editing.
- tapOn: ${output.entryB}
- assertVisible:
    id: 'entry-content-input'

# Open the date picker.
- tapOn:
    id: 'entry-date-button'
- waitForAnimationToEnd
- takeScreenshot: date-picker-open

# Switch to text-input mode, clear the existing date, and type the target past date.
- tapOn:
    id: 'react-native-paper-dates-toggle-edit'
- waitForAnimationToEnd
- eraseText
- inputText: 01/15/2024
- takeScreenshot: date-picker-text-entered

# Confirm the date selection.
- tapOn:
    id: 'react-native-paper-dates-save'
- waitForAnimationToEnd
- takeScreenshot: editor-after-date-change

# Capture the displayed date and time strings from the editor. The list card
# formats the datetime as date + ' ' + time (see JournalEntryCard.formatDate),
# so the expected list-card text is the concatenation of the two button texts.
# The date-text split (date-only on the date button, time-only on the time
# button) means we must capture both and join them to match the card's combined
# string — Maestro assertVisible uses full-string matching, not substring.
- copyTextFrom:
    id: 'entry-date-button-text'
- evalScript: ${output.expectedDateString = maestro.copiedText}
- copyTextFrom:
    id: 'entry-time-button-text'
- evalScript: ${output.expectedTimeString = maestro.copiedText}
- evalScript:
    ${output.expectedCardString = output.expectedDateString + ' ' + output.expectedTimeString}

# ===== RETURN TO JOURNAL LIST =====

# Blur any focused input before system back so the IME does not consume the BACK
# event, then navigate back. The editor's beforeRemove interceptor flushes the
# datetime change to the database.
- tapOn:
    id: 'appbar-header'
- pressKey: BACK
- waitForAnimationToEnd

# Wait for the journal list to reappear and refresh its query.
- extendedWaitUntil:
    visible:
      id: 'create-entry-fab'
    timeout: 10000

# Dismiss the LogBox warning banner if present before asserting on list content.
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# ===== VERIFY NEW SORT ORDER AND DISPLAYED DATE =====

# Entry A kept today's datetime, so it should now be at the top.
- assertVisible: ${output.entryA}
- takeScreenshot: new-order-a-at-top

# Entry B should be visible below A after re-sorting.
- scrollUntilVisible:
    element:
      text: ${output.entryB}
    direction: DOWN
- assertVisible: ${output.entryB}

# The edited entry's card should show the new past date combined with the
# preserved time-of-day, matching the JournalEntryCard.formatDate output.
- assertVisible: ${output.expectedCardString}
- takeScreenshot: final-new-sort-order
