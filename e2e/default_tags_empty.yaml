appId: com.feltech.feltlog
name: Default tags empty when no prior entries


# This flow verifies that when creating the very first entry in a fresh database
# (no prior entries exist), the tag list starts empty — no default tags are
# pre-populated.
# Prerequisites: None - creates its own database.
---
- runFlow: subflows/setup_database.yaml

# ===== CREATE THE FIRST ENTRY IN A FRESH DATABASE =====

- evalScript: ${output.entryContent = "First entry in fresh db " + Date.now().toString()}

- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'

- tapOn:
    id: 'entry-content-input'
- inputText: ${output.entryContent}

- assertVisible: 'Tags'

# Give the async loadDefaultTags fetch a moment to complete. Since there are no
# prior entries, getMostRecentEntryTags returns an empty array and no chips
# should appear. We wait briefly for a non-existent element to allow the async
# fetch to settle, then assert no tag chips are present.
- extendedWaitUntil:
    visible:
      id: 'non-existent-delay-element'
    timeout: 1500
    optional: true

- takeScreenshot: fresh-db-no-default-tags

# Verify the tag input is present and empty (ready for input)
- assertVisible:
    id: 'tag-input'

# Verify no tag chips are present. We assert that common placeholder tag names
# are not visible. Since the database is fresh, no tags exist to be
# pre-populated. The tag chips render as Chip components with the tag name as
# text; asserting a few common names are absent confirms the section is empty.
- assertNotVisible: 'work'
- assertNotVisible: 'personal'
- assertNotVisible: 'groceries'
- assertNotVisible: 'exercise'

# Verify the user can still add a tag manually
- evalScript: ${output.newTag = "firsttag"}
- tapOn:
    id: 'tag-input'
- inputText: ${output.newTag}
- pressKey: Enter
- waitForAnimationToEnd

- assertVisible: ${output.newTag}

- takeScreenshot: fresh-db-after-manual-tag

# Save and return
- tapOn:
    id: 'appbar-header'
- pressKey: BACK
- waitForAnimationToEnd
- assertVisible:
    id: 'create-entry-fab'
