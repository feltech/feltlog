appId: com.feltech.feltlog
name: Restore from backup


# E2E test for the Restore from Backup feature.
# Verifies the entry point on the setup screen lets the user restore
# a database from a backup file.
#
# Merged from:
#   - restore_backup_to_fresh_db.yaml (Flow A: restore to fresh DB,
#     filename-tap regression, backward-compat radio tap)
#   - restore_backup_after_cancel.yaml (Flow B: cancel/return flow,
#     location reconfiguration on restore screen)
#
# Combined flow:
#   1. Create encrypted DB, configure backup location, create an entry + backup.
#   2. clearState + launchApp.
#   3. Cancel flow: tap "Restore from backup", verify restore screen, tap Cancel,
#      verify back on setup screen.
#   4. Location reconfig: tap "Restore from backup" again, verify "No backup
#      location configured" error, reconfigure backup location via SAF picker.
#   5. Wait for backup files to load, verify our backup file is listed.
#   6. Filename-tap regression: scroll to restore-confirm-btn, assert enabled:
#      false, scroll back up, tap filename text directly, verify enabled: true.
#   7. Backward-compat radio tap: also tap leftOf text to verify radio circle.
#   8. Set target DB name, tap Restore, handle confirm dialog if present.
#   9. Wait for restore to complete (db-name-input visible).
#  10. Open restored DB with credentials, verify 'Create entry' appears.
#  11. Navigate to Settings, verify 'Encryption: Enabled'.
#
# Note: The overwrite confirm dialog (safety backup for existing DB)
# cannot be tested via clearState because `adb pm clear` wipes all app
# data including DB files. After clearState, there's never a DB at the
# target name to trigger the overwrite path. That path is covered by
# unit tests in useRestoreFlow.test.ts.
---
# ===== INITIAL SETUP: CREATE ENCRYPTED DB + BACKUP =====
# Collapse clearState + launchApp into a single launchApp: clearState: true
# call. This reduces the number of ADB process-kill boundaries (each kill can
# race with an in-flight Fabric mount transaction and trigger the upstream
# React Native Scheduler use-after-free, SIGSEGV in mqt_v_js). launchApp
# applies the clearState atomically as part of the launch, so the separate
# clearState kill is no longer needed.
- launchApp:
    clearState: true

# Wait for the app to fully load after clearState kills the process.
# Use optional: true so we can retry if the app lands on the home screen.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 15000
    optional: true

# If the setup screen didn't appear, relaunch the app
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 30000

- evalScript: ${output.dbName = "restore_merged_" + Date.now() + ".db"}
- evalScript: ${output.dbKey = "restore_key_merged"}

- assertVisible:
    id: 'db-name-input'
- tapOn:
    id: 'db-name-input'
    point: '95%,50%'
- eraseText
- inputText: ${output.dbName}
- tapOn:
    id: 'db-key-input'
- inputText: ${output.dbKey}
- tapOn:
    id: 'db-open-btn'

- assertVisible: 'Create entry'
- takeScreenshot: restore-merged-journal-ready

# ===== CREATE AN ENTRY AND BACKUP =====

# Dismiss LogBox warning if present — it can cover the FAB
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

- setLocation:
    latitude: 53.787977855061214
    longitude: -2.244492876694697

- evalScript: ${output.entryText = "Restore merged test " + Date.now()}
- tapOn:
    id: 'create-entry-fab'
- assertVisible:
    id: 'entry-content-input'
- tapOn:
    id: 'entry-content-input'
- inputText: ${output.entryText}
# Save entry and navigate back by tapping the back button directly.
# The entry editor's beforeRemove listener intercepts back navigation,
# calls e.preventDefault(), and does an async save (createEntry +
# loadEntries + loadTags). On slow emulators, this chain can take
# variable time. If the first tap doesn't complete the navigation
# within 10 seconds, the isLeavingRef guard allows a second back
# press to bypass the handler and navigate immediately.
- tapOn: 'Back'
- extendedWaitUntil:
    visible:
      id: 'create-entry-fab'
    timeout: 10000
    optional: true
# If still on the entry editor, press BACK again — the beforeRemove
# guard (isLeavingRef.current = true) lets the second press through.
- runFlow:
    when:
      visible: 'Back'
    commands:
      - tapOn: 'Back'
- extendedWaitUntil:
    visible:
      id: 'create-entry-fab'
    timeout: 60000
- assertVisible:
    id: 'create-entry-fab'
- takeScreenshot: restore-merged-entry-created

# ===== NAVIGATE TO SETTINGS AND CONFIGURE BACKUP =====

- waitForAnimationToEnd
- tapOn:
    point: '50%,96%'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-settings

- assertVisible: 'Backup'
- assertVisible: 'No backup location configured'

# Open SAF picker for backup location
- tapOn:
    id: 'choose-backup-location-btn'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-saf-picker

- runFlow:
    when:
      visible: 'sdk_gphone64_x86_64'
    commands:
      - tapOn: 'sdk_gphone64_x86_64'
      - waitForAnimationToEnd
      - takeScreenshot: restore-merged-saf-root

- scrollUntilVisible:
    element: 'Pictures'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: 'Pictures'
    commands:
      - tapOn: 'Pictures'
      - waitForAnimationToEnd
      - takeScreenshot: restore-merged-saf-folder-selected

- tapOn: 'USE THIS FOLDER'
- waitForAnimationToEnd
- tapOn: 'ALLOW'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-settings-location-set

# Dismiss LogBox warning banner if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

- assertVisible: 'Location: (Pictures|Documents)'

# Guard against minute-boundary races
- evalScript: ${output.backupSecond = new Date().getUTCSeconds()}
- runFlow:
    when:
      true: ${output.backupSecond >= 55}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'wait-element-for-minute-crossing'
          timeout: 6000
          optional: true

- runScript: scripts/compute-backup-prefix.js

- tapOn:
    id: 'backup-now-btn'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Backup saved'
    timeout: 60000
- assertVisible: 'Backup saved'
- takeScreenshot: restore-merged-backup-done

# ===== WIPE STATE AND TEST CANCEL/RETURN FLOW =====

# Collapse clearState + launchApp into a single launchApp: clearState: true
# call (see INITIAL SETUP above for rationale).
- launchApp:
    clearState: true

# Wait for the app to fully load after clearState kills the process.
# Use optional: true so we can retry if the app lands on the home screen.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 15000
    optional: true

# If the setup screen didn't appear, relaunch the app
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 30000

# If still not visible after relaunch, try once more (emulator may be slow)
- runFlow:
    when:
      notVisible:
        id: 'db-name-input'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'db-name-input'
          timeout: 60000

- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

- assertVisible:
    id: 'db-name-input'
- assertVisible:
    id: 'restore-backup-btn'

# Tap "Restore from backup" to open the restore screen
- tapOn:
    id: 'restore-backup-btn'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-restore-screen

# Verify restore screen elements.
# Note: the encryption key input was removed — restore is now a pure
# file copy that returns the user to the setup screen.
- assertVisible:
    id: 'restore-db-name-input'
- assertVisible:
    id: 'restore-confirm-btn'
- assertVisible:
    id: 'restore-cancel-btn'

# Tap Cancel — should return to the setup screen
- tapOn:
    id: 'restore-cancel-btn'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-back-to-setup

# Verify we're back on the setup screen
- assertVisible:
    id: 'db-name-input'
- assertVisible:
    id: 'db-open-btn'
- assertVisible:
    id: 'restore-backup-btn'

# ===== HARDWARE BACK BUTTON ON RESTORE SCREEN =====
# RestoreFromBackupScreen is now a proper Expo Router Stack screen
# (app/restore-backup.tsx) guarded by Stack.Protected. The custom
# BackHandler was removed — React Navigation's Stack navigator handles
# the Android hardware back button automatically, popping the restore
# screen and returning to the setup screen. This test verifies that
# pressKey: Back performs that pop rather than exiting the app.
- tapOn:
    id: 'restore-backup-btn'
- waitForAnimationToEnd
- assertVisible:
    id: 'restore-db-name-input'
- takeScreenshot: restore-merged-hw-back-restore-screen
- pressKey: Back
- waitForAnimationToEnd
- takeScreenshot: restore-merged-hw-back-returned
- assertVisible:
    id: 'db-name-input'
- assertVisible:
    id: 'restore-backup-btn'

# ===== LOCATION RECONFIG + FULL RESTORE FLOW =====

# Tap "Restore from backup" again
- tapOn:
    id: 'restore-backup-btn'
- waitForAnimationToEnd

# Verify the "No backup location configured" error is shown on the
# RestoreFromBackupScreen. The full text is "No backup location
# configured. Tap "Choose Backup Location" below." — use regex for
# a partial match since Maestro matches full element text.
# (clearState wiped AsyncStorage which held the backup dir URI)
- assertVisible: 'No backup location configured.*'
- takeScreenshot: restore-merged-no-backup-location

# Reconfigure backup location via SAF picker on the restore screen
- tapOn:
    id: 'restore-choose-backup-location-btn'
- waitForAnimationToEnd

- runFlow:
    when:
      visible: 'sdk_gphone64_x86_64'
    commands:
      - tapOn: 'sdk_gphone64_x86_64'
      - waitForAnimationToEnd

- scrollUntilVisible:
    element: 'Pictures'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: 'Pictures'
    commands:
      - tapOn: 'Pictures'
      - waitForAnimationToEnd

- tapOn: 'USE THIS FOLDER'
- waitForAnimationToEnd
- tapOn: 'ALLOW'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-restore-location-configured

# Dismiss LogBox if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Wait for backup files to load
- extendedWaitUntil:
    visible: 'Backup files'
    timeout: 10000

# The backup file list should show the backup we just created.
# Use the specific regex computed before the backup so we match the
# right file and not an old one from previous test runs.
- scrollUntilVisible:
    element: ${output.backupFileRegex}
    direction: DOWN
    timeout: 30000
- assertVisible: ${output.backupFileRegex}
- takeScreenshot: restore-merged-files-listed

# ===== FILENAME-TAP REGRESSION (from Flow A) =====
# Regression test (was the root cause of user-reported bug): tapping the
# filename label directly must select the file. Before the fix, only the
# tiny radio circle was tappable; tapping the filename text did nothing
# and the Restore button stayed disabled with no feedback. Now
# RadioButton.Item wraps the entire row in TouchableRipple.
#
# The Restore/Cancel buttons are at the bottom of the ScrollView, below
# the file list. When many backup files are present, they are scrolled
# off-screen. Scroll down to find and assert the button state.
- scrollUntilVisible:
    element:
      id: 'restore-confirm-btn'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'restore-confirm-btn'
    enabled: false
- takeScreenshot: restore-merged-button-disabled-before-tap

# Scroll back up to the file list to select a file.
# Use the input at the top as an anchor since "Backup files" label
# may not be visible when scrolled far down. Increase timeout since
# scrolling past many list items can be slow.
- scrollUntilVisible:
    element:
      id: 'restore-db-name-input'
    direction: UP
    timeout: 30000

# Tap the filename text directly. This is the natural user gesture
# (tapping the file they want to restore). We use the regex pattern
# because the full filename (including seconds) is not predictable.
# Maestro's text matching is full-string regex, so the prefix pattern
# matches the complete filename.
- scrollUntilVisible:
    element: ${output.backupFileRegex}
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ${output.backupFileRegex}
- waitForAnimationToEnd

# Verify the Restore button is now enabled. If this fails, the radio
# row is not tappable and the user will see "no effect" again.
# Scroll down to the button again.
- scrollUntilVisible:
    element:
      id: 'restore-confirm-btn'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'restore-confirm-btn'
    enabled: true
- takeScreenshot: restore-merged-file-selected

# ===== BACKWARD-COMPAT RADIO TAP (from Flow A) =====
# Also keep the original `leftOf` radio tap as backward-compat coverage
# (the radio circle itself is still tappable). Scroll back up to the file
# list first.
- scrollUntilVisible:
    element:
      id: 'restore-db-name-input'
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element: ${output.backupFileRegex}
    direction: DOWN
    timeout: 30000
- tapOn:
    leftOf:
      text: ${output.backupFileRegex}
- waitForAnimationToEnd
- takeScreenshot: restore-merged-file-selected-backward-compat

# ===== SET TARGET DB NAME AND RESTORE =====

# Set the target DB name to a NEW name so there's no existing DB to
# overwrite (no confirm dialog will appear). Scroll to the top of the
# form where the input fields are.
- scrollUntilVisible:
    element:
      id: 'restore-db-name-input'
    direction: UP
    timeout: 30000
- tapOn:
    id: 'restore-db-name-input'
    point: '95%,50%'
- eraseText
- evalScript: ${output.restoredDbName = "restored_merged_" + Date.now() + ".db"}
- inputText: ${output.restoredDbName}

# Dismiss the keyboard by tapping a non-interactive area. On the emulator,
# Maestro injects text directly without showing the keyboard, but the IME
# may still be in a focused state. Tapping the "Backup files" label blurs
# the input and dismisses any soft keyboard overlay.
- tapOn: 'Backup files'
- waitForAnimationToEnd

- takeScreenshot: restore-merged-restore-form-filled

# Dismiss LogBox warning if it covers the Restore button
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Scroll down to the Restore button before tapping it.
# The backup file list can be long (accumulated files from prior test
# runs), so use a generous timeout and faster scroll speed.
- scrollUntilVisible:
    element:
      id: 'restore-confirm-btn'
    direction: DOWN
    timeout: 30000
    speed: 80

# Tap Restore — a confirm dialog may appear if the target DB name
# collides with an existing file (e.g. if fileExists creates the file
# when checking). Handle it by confirming the dialog.
- tapOn:
    id: 'restore-confirm-btn'
- waitForAnimationToEnd

# If a confirm dialog appeared, tap "Restore" in the dialog to proceed.
- runFlow:
    when:
      visible:
        id: 'restore-dialog-confirm'
    commands:
      - tapOn:
          id: 'restore-dialog-confirm'
      - waitForAnimationToEnd

# Wait for the restore to complete. After a successful restore, the
# RestoreFromBackupScreen calls router.replace('/setup'), which returns
# the user to the setup screen.
- extendedWaitUntil:
    visible:
      id: 'db-name-input'
    timeout: 60000
- assertVisible:
    id: 'db-name-input'
- takeScreenshot: restore-merged-restore-complete

# ===== OPEN THE RESTORED DATABASE =====

# The setup screen is now showing. After a successful restore, the app
# persists the restored database name and pre-fills it on the setup screen,
# so the DB name field should already contain the correct value.
- takeScreenshot: restore-merged-db-name-prefilled
- tapOn:
    id: 'db-key-input'
- inputText: ${output.dbKey}
- tapOn:
    id: 'db-open-btn'

# Wait for the journal screen to appear — this proves the restored
# database was opened successfully with the correct encryption key.
- extendedWaitUntil:
    visible: 'Create entry'
    timeout: 30000
- assertVisible: 'Create entry'
- takeScreenshot: restore-merged-restored-db-opened

# Dismiss LogBox if present
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: '93%,92%'
      - waitForAnimationToEnd

# Navigate to Settings and verify the restored database
- tapOn:
    point: '50%,96%'
- waitForAnimationToEnd
- takeScreenshot: restore-merged-settings-verified

# Verify database section shows encryption is enabled
- assertVisible: 'Encryption: Enabled'
